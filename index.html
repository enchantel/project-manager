<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    
    <title>Project Manager</title>
</head>
<body>
    <div class="full-container">
        <div class="nav-bar">
            <div class="logo">
                <h1> Enchante </h1>
            </div>

            <div class="main-navbar">
                <h2> Main </h2>
                <ul class="side-links">
                    <li class="active"><a href="index.html"><span>◌</span> Dashboard</a></li>
                    <li><a href="projects.html"><span>▦</span> Projects</a></li>
                    <li><a href="#"><span>✓</span> Tasks</a></li>
                    <li><a href="#"><span>◷</span> Calendar</a></li>
                </ul>
                <h2> Dashboard </h2>
                <ul class="side-links">
                    <li><a href="#">Workspace</a></li>
                    <li><a href="#">Starred</a></li>
                </ul>
            </div>
            <div class="sidebar-note"><span class="note-mark">✦</span><strong>Keep the momentum</strong><small>Three deadlines are coming up this week.</small></div>
        </div>

        <div class="main-container">
            <h1> Hi, Chantelle!</h1>
            <h2> Project Manager </h2>
            <section class="content-page">
                <div class="projects-scroll">
                    <button class="scroll-left" type="button" aria-label="Show previous project" onclick="plusDivs(-1)"></button>
                    
                    <div class="projects-slide" id="slide-1"></div>
                    <div class="projects-slide" id="slide-2"></div>
                    <div class="projects-slide" id="slide-3"></div>
                    <div class="projects-slide" id="slide-4"></div>
                    
                    
                    <button class="scroll-right" type="button" aria-label="Show next project" onclick="plusDivs(1)"></button>
                </div>
                <div class="project-progress">
                    <div class="projects">
                        <div class="projects-list">
                            <div class="project">
                                <img src="https://i.pinimg.com/736x/01/68/58/01685852c9e760e3d2047c7d8e5f8ecf.jpg">
                            </div>
                            <div class="project">
                                <img src="https://i.pinimg.com/736x/17/3b/14/173b14f7a9852289fbcce75e404e973d.jpg">
                            </div>
                            <div class="project">
                                <img src="https://i.pinimg.com/736x/0d/8e/f2/0d8ef2be0a4ba0913284ab48827365d0.jpg">
                            </div>
                        </div>
                        <a href="projects.html" class="view-more"> View More </a>
                    </div>
                    <div class="calendar">
                        <h2> Big Timeline </h2>
                        <div class="calendar-header">
                            <button id="prev-month">‹</button>
                            <div id="month-year"></div>
                            <button id="next-month">›</button>
                        </div>
                        <div class="calendar-body">
                            <div class="calendar-weekdays">
                                <div>Sun</div>
                                <div>Mon</div>
                                <div>Tue</div>
                                <div>Wed</div>
                                <div>Thu</div>
                                <div>Fri</div>
                                <div>Sat</div>
                            </div>
                            <div class="calendar-dates">
                        
                            </div>
                        </div>
                    </div>
                </div>
                <div class="activity-bar">
                    <div class="task-list">

                    </div>
                    <div class="productivity">
                        
                    </div>
                </div>
            </section>
        </div>
    </div>
</body>
<script src="js/page-transition.js"></script>
<script src="js/script.js"></script>
<script src="js/calendar.js"></script>
</html>
