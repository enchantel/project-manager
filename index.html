<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="script.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    
    <title>Project Manager</title>
</head>
<body>
    <div class="full-container">
        <div class="nav-bar">
            <div class="logo">  
                <h1> Enchante </h1>
            </div>
            
            <div class="main-navbar">
                <h2> Main </h2>
                <li>
                    <ul><img src="https://i.pinimg.com/1200x/c5/bf/3d/c5bf3d93679e614d330e44d8a4004169.jpg"><a href=""> Dashboard </a></ul>
                    <ul><img src="https://i.pinimg.com/736x/90/c0/2f/90c02fef3b25101c3162a4c4074d5c50.jpg"><a href=""> Projects </a></ul>
                    <ul><img src="https://i.pinimg.com/1200x/53/4c/06/534c06f7088ed84d5353cad87c50d473.jpg"><a href=""> Tasks </a></ul>
                    <ul><img src="https://i.pinimg.com/736x/36/79/c6/3679c64eeebbd9813bcedf02b069bbec.jpg"><a href=""> Calendar </a></ul>
                </li>
                <h2> Dashboard </h2>
                <li>
                    <ul> Workspace </ul>
                    <ul> Starred </ul>
                </li>
            </div>
        </div>

        <div class="main-container">
            <h1> Hi, Chantelle!</h1>
            <h2> Project Manager </h2>
            <section class="content-page">
                <div class="projects-scroll">
                    <button class="scroll-left" type="button" aria-label="Show previous project" onclick="plusDivs(-1)"></button>
                    
                    <img class="projects-slide" src="https://i.pinimg.com/1200x/f3/69/72/f369729f2e2436c7e6199264a27848d8.jpg">
                    <img class="projects-slide" src="https://i.pinimg.com/1200x/b1/5e/0a/b15e0a1c6e20ac0492519dadba8574b7.jpg">
                    <img class="projects-slide" src="https://i.pinimg.com/1200x/c8/a8/f1/c8a8f19fa9f79428a1293db86b2d7015.jpg">
                    <img class="projects-slide" src="https://i.pinimg.com/736x/cd/55/ca/cd55ca581c6f7dde498ed9be4bb16d14.jpg">
                    
                    
                    <button class="scroll-right" type="button" aria-label="Show next project" onclick="plusDivs(1)"></button>
                </div>
                <div class="project-progress">
                    <div class="projects">
                        <div class="projects-list">
                            <div class="project">
                                <img src="https://i.pinimg.com/736x/01/68/58/01685852c9e760e3d2047c7d8e5f8ecf.jpg">
                            </div>
                            <div class="project">
                                <img src="https://i.pinimg.com/736x/17/3b/14/173b14f7a9852289fbcce75e404e973d.jpg">
                            </div>
                            <div class="project">
                                <img src="https://i.pinimg.com/736x/0d/8e/f2/0d8ef2be0a4ba0913284ab48827365d0.jpg">
                            </div>
                        </div>
                        <button class="view-more"> View More </button>
                    </div>
                    <div class="calendar">
                        <h2> Big Timeline </h2>
                        <div class="calendar-header">
                            <button id="prev-month">‹</button>
                            <div id="month-year"></div>
                            <button id="next-month">›</button>
                        </div>
                        <div class="calendar-body">
                            <div class="calendar-weekdays">
                                <div>Sun</div>
                                <div>Mon</div>
                                <div>Tue</div>
                                <div>Wed</div>
                                <div>Thu</div>
                                <div>Fri</div>
                                <div>Sat</div>
                            </div>
                            <div class="calendar-dates">
                        
                            </div>
                        </div>
                    </div>
                </div>
                <div class="activity-bar">
                    <div class="task-list">

                    </div>
                    <div class="productivity">
                        
                    </div>
                </div>
            </section>
        </div>
    </div>
</body>
<script src="script.js"></script>
<script src="calendar.js"></script>
</html>
